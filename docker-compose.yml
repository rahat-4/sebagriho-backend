services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./core:/app
    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  oorep-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=oorep_import
      - POSTGRES_USER=oorep
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - oorep_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5051:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  pgadmin_data:
  oorep_data: